services:
 db:
  image: postgres:16
  environment:
   POSTGRES_USER: taskflow
   POSTGRES_PASSWORD: taskflow
   POSTGRES_DB: taskflow
  volumes:
   - postgres_data:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 10s

 api:
  image: ghcr.io/kurohakke003/taskflow-devops:latest
  container_name: api_service
  depends_on:
   db:
    condition: service_healthy
  env_file:
   - .env
  restart: unless-stopped
  healthcheck:
   test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 10s

 nginx:
  image: nginx:latest
  depends_on:
   api:
    condition: service_healthy
  restart: unless-stopped
  ports:
   -  "80:80"
  volumes:
   - ./nginx.conf:/etc/nginx/conf.d/default.conf

 node-exporter:
  image: ghcr.io/prometheus/node-exporter-linux-amd64:v1.12.1
  container_name: node-exporter
  command:
    - '--path.rootfs=/host'
  network_mode: host
  pid: host
  restart: unless-stopped
  volumes:
   - '/:/host:ro,rslave' 

 prometheus:
    image: ghcr.io/prometheus/prometheus-linux-amd64:v3.16.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      - ./prometheus/rules:/etc/prometheus/rules
    command:
      - '--web.external-url=https://kuro.tailf6fa49.ts.net/prometheus/'
      - '--web.route-prefix=/'
      - '--config.file=/etc/prometheus/prometheus.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"

 grafana:
  image: grafana/grafana-enterprise:13.3.1-ubuntu
  container_name: grafana
  ports:
   - "3000:3000"
  restart: unless-stopped
  volumes:
   - grafana_data:/var/lib/grafana

 alertmanager:
  image: prom/alertmanager:v0.31.1
  container_name: alertmanager
  ports:
   - "9093:9093"
  restart: unless-stopped
  volumes:
   - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
   - ./secrets:/etc/alertmanager/secrets:ro

volumes:
 postgres_data:
 prometheus_data:
 grafana_data:
