apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
data:
  APP_PORT: {{ .Values.app.port | quote }}
  APP_ENV: {{ .Values.app.env | quote }}
  APP_HOST: {{ .Values.app.host | quote }}
  APP_NAME: {{ .Values.app.name | quote }}
