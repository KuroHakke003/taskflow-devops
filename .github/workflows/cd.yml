name: Build and Push to GHCR
on:
 push:
  branches: [ "main" ]
 pull_request:
  branches: [ "main" ]
permissions:
  contents: read
  packages: write
jobs:
 test:
  runs-on: ubuntu-latest
  env:
     DATABASE_URL: postgresql+psycopg://taskflow:taskflow@localhost:5432/taskflow
  services:
   postgres:
    image: postgres:16
    env:
     POSTGRES_USER: taskflow
     POSTGRES_PASSWORD: taskflow
     POSTGRES_DB: taskflow
    options: >-
      --health-cmd "pg_isready -U taskflow -d taskflow"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5
      --health-start-period 10s
    ports:
     - "5432:5432"
  steps:
   - name: Checkout repository code
     uses: actions/checkout@v4

   - name: Set up Python 3.12
     uses: actions/setup-python@v5
     with:
      python-version: '3.12'
      cache: 'pip'

   - name: Install dependencies
     run: |
      python -m pip install --upgrade pip
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

   - name: Run tests with pytest
     run: |
      pytest
 build-and-push:
  needs: test
  runs-on: ubuntu-latest
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  steps:
   - name: Checkout repository
     uses: actions/checkout@v4
   - name: Log In to GHCR
     uses: docker/login-action@v3
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}
   - name: Build and push Docker image
     uses: docker/build-push-action@v6
     with:
      context: .
      push: true
      tags: |
       ghcr.io/kurohakke003/taskflow-devops:latest
       ghcr.io/kurohakke003/taskflow-devops:${{ github.sha }}
