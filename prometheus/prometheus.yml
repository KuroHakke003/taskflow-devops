global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'alertmanager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'taskflow-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']


rule_files:
 - "rules/*.yml"


alerting:
 alertmanagers:
  - static_configs:
     - targets:
         - alertmanager:9093
