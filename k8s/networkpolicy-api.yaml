apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taskflow-api-network-policy
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: taskflow-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
